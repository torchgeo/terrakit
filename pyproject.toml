[project]
name = "TerraKit"
version = "0.1.8.post1"
description = "A Python package for finding and getting geospatial data."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {"name"="Blair Edwards", "email"="bedwards@uk.ibm.com"},
    {"name"="Rosie Lickorish"},
    {"name" = "Leonardo Pondian Tizzei"},
    {"name" = "Fred Ochieng Otieno"},
    {"name" = "Beldine Moturi"},
    {"name" = "Catherine Wanjiru"},
    {"name" = "Benedikt Blumenstiel"},
    {"name" = "Brian Ogolla"},
    {"name" = "Romeo Kienzler"},
    ]
dependencies = [
        "aiohttp>=3.14.0",
        "boto3>=1.36.0",
        "contextily>=1.6.2",
        "cdsapi>=0.7.7",
        "click>=8.3.3",
        "dask>=2025.7.0",
        "folium>=0.20.0",
        "huggingface-hub",
        "geojson>=3.2.0",
        "geopandas>=1.1.2",
        "idna>=3.15",
        "joblib>=1.5.2",
        "jsonargparse>=4.40.2",
        "netcdf4>=1.7.3",
        "nest-asyncio>=1.6.0",
        "numpy>=1.26.4",
        "pillow>=12.3.0",
        "pydantic>=2.11.7",
        "pystac-client>=0.9.0",
        "python-dotenv>=1.2.2",
        "rasterio>=1.4.3",
        "requests>=2.33.0",
        "rioxarray[interp]>=0.19.0",
        "s3fs>=2025.1.0",
        "scikit-learn>=1.7.1",
        "sentinelhub>=3.11.1",
        "shapely>=2.1.1",
        "stackstac>=0.5.1",
        "tacoreader==2.4.21",
        "tacotoolbox==0.26.9",
        "tqdm>=4.67.1",
        "xarray>=v2023.1.0 ",
        "urllib3>=2.7.0",
        "zarr>=2.18.0",
]

[dependency-groups]
dev = [
    "flaky>=3.8.1",
    "jupyter>=1.1.1",
    "jupyter-core>=5.8.1",
    "ipywidgets>=8.1.8",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "mkdocs-jupyter>=0.25.1",
    "mkdocs-material>=9.6.16",
    "mkdocstrings[python]>=0.30.0",
    "mypy>=1.17.1",
    "notebook>=7.4.4",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.15.1",
    "pytest-skip-slow>=0.0.5",
    "pytest-xdist>=3.8.0",
    "requests-mock>=1.12.1",
    "ruff>=0.12.7",
]

[project.urls]
Documentation = "https://torchgeo.github.io/terrakit/"
Issues = "https://github.com/torchgeo/terrakit/issues"
Source = "https://github.com/torchgeo/terrakit"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = ""
module-name = "terrakit"

[tool.uv.sources]
detect-secrets = { git = "https://github.com/ibm/detect-secrets.git", rev = "master" }


[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
filterwarnings = [
    'ignore::RuntimeWarning:pyogrio',
    'ignore::UserWarning:terrakit.transform.labels',

]

[project.scripts]
terrakit = "terrakit.__main__:main"
